# Checks every pull request against the rules in CONTRIBUTING.md.
#
# "Check macro" runs scripts/check_macro_pr.py on the macro folder the pull
# request changes. The script is taken from main, not from the pull request,
# so a macro pull request can't loosen the rules it is checked against.
# (The pull request can still edit this workflow file itself; that is why
# auto-merge.yml checks again from main and only ever merges pull requests
# that change nothing outside their own macro folder.)
#
# "Test checker" runs the tests with the pull request's version of the
# scripts, for pull requests that change them.
#
# The header parser is OpenSAK's src/opensak/macro/metadata.py. Both jobs
# fetch the whole src/opensak folder of the commit in .github/opensak-ref
# (a sparse, shallow git fetch), because the checks against the stable
# release use OpenSAK's helpers in metadata.py, which import its macro
# runtime: that needs OPENSAK_DEPS (no Qt). The mode of those checks
# (off / warn / error) is in .github/stable-checks.

name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # What OpenSAK's macro runtime imports, as pinned in OpenSAK's pyproject.toml
  # (space-separated; used unquoted, so no spaces inside a requirement)
  OPENSAK_DEPS: "lupa>=2.0,<3 sqlalchemy>=2.0,<2.2 lxml>=5.0,<7 certifi"
  OPENSAK_REPO: https://github.com/OpenSAK-Org/OpenSAK

jobs:
  check-macro:
    name: Check macro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Lua compiler and OpenSAK's macro runtime dependencies
        run: pip install $OPENSAK_DEPS

      - name: Get checker and settings (from main) and OpenSAK's source
        id: setup
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          from_main() { git show "$BASE:$1" 2>/dev/null || cat "$1"; }
          from_main scripts/check_macro_pr.py > "$RUNNER_TEMP/tools/check_macro_pr.py"
          ref=$(from_main .github/opensak-ref | grep -v '^#' | head -n 1 | tr -d '[:space:]')
          mode=$(from_main .github/stable-checks 2>/dev/null | grep -v '^#' | head -n 1 | tr -d '[:space:]')
          echo "stable_checks=${mode:-off}" >> "$GITHUB_OUTPUT"
          src="$RUNNER_TEMP/opensak-git"
          git init -q "$src"
          git -C "$src" remote add origin "$OPENSAK_REPO"
          git -C "$src" sparse-checkout set --no-cone /src/opensak/
          git -C "$src" fetch -q --depth 1 --filter=blob:none origin "$ref"
          git -C "$src" checkout -q FETCH_HEAD

      - name: Check macro
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          STABLE_CHECKS: ${{ steps.setup.outputs.stable_checks }}
        run: |
          checker="$RUNNER_TEMP/tools/check_macro_pr.py"
          stable=()
          # A checker on main from before --stable-checks doesn't know it
          if grep -q -- "--stable-checks" "$checker"; then
            stable=(--stable-checks "$STABLE_CHECKS")
          fi
          python -I "$checker" \
            --repo . --base "$BASE" --head "$HEAD" \
            --metadata "$RUNNER_TEMP/opensak-git/src/opensak/macro/metadata.py" \
            "${stable[@]}"

  test-checker:
    name: Test checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install $OPENSAK_DEPS pytest

      - name: Get OpenSAK's source
        run: |
          ref=$(grep -v '^#' .github/opensak-ref | head -n 1 | tr -d '[:space:]')
          src="$RUNNER_TEMP/opensak-git"
          git init -q "$src"
          git -C "$src" remote add origin "$OPENSAK_REPO"
          git -C "$src" sparse-checkout set --no-cone /src/opensak/
          git -C "$src" fetch -q --depth 1 --filter=blob:none origin "$ref"
          git -C "$src" checkout -q FETCH_HEAD
          mkdir -p .tools
          mv "$src/src/opensak" .tools/opensak

      - name: Run tests
        run: pytest -v tests/
