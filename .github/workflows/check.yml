# Checks every pull request against the rules in CONTRIBUTING.md.
#
# "Check macro" runs scripts/check_macro_pr.py on the macro folder the pull
# request changes. The script is taken from main, not from the pull request,
# so a macro pull request can't loosen the rules it is checked against.
# (The pull request can still edit this workflow file itself; that is why
# auto-merge.yml checks again from main and only ever merges pull requests
# that change nothing outside their own macro folder.)
#
# "Test checker" runs the tests with the pull request's version of the
# scripts, for pull requests that change them.
#
# The header parser is OpenSAK's src/opensak/macro/metadata.py, downloaded
# from the commit in .github/opensak-ref.

name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LUPA: "lupa>=2.0,<3"
  PARSER_URL: https://raw.githubusercontent.com/OpenSAK-Org/OpenSAK/%s/src/opensak/macro/metadata.py

jobs:
  check-macro:
    name: Check macro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Lua compiler
        run: pip install "$LUPA"

      - name: Get checker (from main) and OpenSAK header parser
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          from_main() { git show "$BASE:$1" 2>/dev/null || cat "$1"; }
          from_main scripts/check_macro_pr.py > "$RUNNER_TEMP/tools/check_macro_pr.py"
          ref=$(from_main .github/opensak-ref | grep -v '^#' | head -n 1 | tr -d '[:space:]')
          curl -fsSL -o "$RUNNER_TEMP/tools/macro_metadata.py" "$(printf "$PARSER_URL" "$ref")"

      - name: Check macro
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -I "$RUNNER_TEMP/tools/check_macro_pr.py" \
            --repo . --base "$BASE" --head "$HEAD" \
            --metadata "$RUNNER_TEMP/tools/macro_metadata.py"

  test-checker:
    name: Test checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "$LUPA" pytest

      - name: Get OpenSAK header parser
        run: |
          mkdir -p .tools
          ref=$(grep -v '^#' .github/opensak-ref | head -n 1 | tr -d '[:space:]')
          curl -fsSL -o .tools/macro_metadata.py "$(printf "$PARSER_URL" "$ref")"

      - name: Run tests
        run: pytest -v tests/
