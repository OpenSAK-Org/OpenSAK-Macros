# Checks every pull request against the rules in CONTRIBUTING.md.
#
# "Check macro" runs scripts/check_macro_pr.py on the macro folder the pull
# request changes. The script is taken from main, not from the pull request,
# so a macro pull request can't loosen the rules it is checked against.
# (The pull request can still edit this workflow file itself; that is why the
# auto-merge workflow re-checks from main and only ever merges pull requests
# that change nothing outside their own macro folder.)
#
# "Test checker" runs the checker's own tests with the pull request's
# version of the script, for pull requests that change the checker.
#
# The header parser is OpenSAK's src/opensak/macro/metadata.py, downloaded
# from a pinned commit. Bump OPENSAK_REF deliberately when the macro header
# rules change in OpenSAK; until then the rules here stay put.

name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # OpenSAK v1.22.0-beta.9
  OPENSAK_REF: 7f2bf6daafb91aee9357c9b5363655af8424a4fc
  LUPA: "lupa>=2.0,<3"

jobs:
  check-macro:
    name: Check macro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua compiler
        run: pip install "$LUPA"

      - name: Get checker (from main) and OpenSAK header parser
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          if git cat-file -e "$BASE:scripts/check_macro_pr.py" 2>/dev/null; then
            git show "$BASE:scripts/check_macro_pr.py" > "$RUNNER_TEMP/tools/check_macro_pr.py"
          else
            echo "::notice::main has no checker yet; using the pull request's version."
            cp scripts/check_macro_pr.py "$RUNNER_TEMP/tools/check_macro_pr.py"
          fi
          curl -fsSL -o "$RUNNER_TEMP/tools/macro_metadata.py" \
            "https://raw.githubusercontent.com/OpenSAK-Org/OpenSAK/${OPENSAK_REF}/src/opensak/macro/metadata.py"

      - name: Check macro
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -I "$RUNNER_TEMP/tools/check_macro_pr.py" \
            --repo . --base "$BASE" --head "$HEAD" \
            --metadata "$RUNNER_TEMP/tools/macro_metadata.py" \
            --json "$RUNNER_TEMP/macro-check.json"

      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-check
          path: ${{ runner.temp }}/macro-check.json
          if-no-files-found: ignore
          retention-days: 7

  test-checker:
    name: Test checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "$LUPA" pytest

      - name: Get OpenSAK header parser
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/macro_metadata.py \
            "https://raw.githubusercontent.com/OpenSAK-Org/OpenSAK/${OPENSAK_REF}/src/opensak/macro/metadata.py"

      - name: Run tests
        run: pytest -v tests/
